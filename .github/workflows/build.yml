name: build-pkg
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git file
      - name: Diagnose
        run: |
          echo "== bin/linux =="; ls -la /lib/OpenOrbisSDK/bin/linux || true
          echo "== file =="; file /lib/OpenOrbisSDK/bin/linux/create-fself || true
          echo "== ldd =="; ldd /lib/OpenOrbisSDK/bin/linux/create-fself || true
          echo "== search =="; find / -name "create-fself*" 2>/dev/null || true
          echo "== os =="; cat /etc/os-release | head -3
      - name: Build hello_world sample
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/tc
          cd /tmp/tc/samples/hello_world
          make
          mkdir -p /tmp/out && find /tmp/tc/samples/hello_world -name "*.pkg" -exec cp {} /tmp/out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg
          path: /tmp/out/
